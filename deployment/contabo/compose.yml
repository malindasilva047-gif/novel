x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_app_db}
      MYSQL_USER: ${MYSQL_USER:-novelhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      ENV: production
      DEBUG: "false"
      DB_TYPE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-novelhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_app_db}
      MYSQL_SSL_DISABLED: "false"
      MYSQL_INIT_SQL: setup_railway.sql
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin_Supun}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      UPLOAD_DIR: /app/uploads
      WEB_AUTH_ORIGINS: ${WEB_AUTH_ORIGINS:-https://wingsaga.com,https://www.wingsaga.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://wingsaga.com,https://www.wingsaga.com}
      AUTO_RUN_DB_MIGRATIONS: "true"
      AUTO_RUN_INKITT_SEED: "true"
      RUN_CONTENT_ENRICHMENT: "background"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ../../story_card_images:/story_card_images:ro
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website/dist:/usr/share/nginx/html:ro
      - /opt/novelhub/certbot/www:/var/www/certbot:ro
      - /opt/novelhub/certbot/conf:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  uploads:
